apply plugin: 'java'
apply plugin: 'application'

application {
    mainClass = 'com.mayezer.emailorganizer.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.api-client:google-api-client:2.0.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    implementation 'com.google.apis:google-api-services-gmail:v1-rev20220404-2.0.0'
    implementation 'org.postgresql:postgresql:42.7.8' // Adicionamos o Postgres para o uso do JDBC.
    implementation 'org.jsoup:jsoup:1.23.2' // jsoup interpreta a estrutura HTML e oferece métodos para extrair o conteúdo textual.
}
